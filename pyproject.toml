[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ontoverifier"
version = "0.1.0"
description = "Prove things about ontologies: an untrusted search writes Lean proofs and Lean's kernel checks them."
requires-python = ">=3.11"
dependencies = ["rdflib>=7"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ontoverifier = "ontoverifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
